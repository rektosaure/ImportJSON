name: Synchronize dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: synchronize-dev
  cancel-in-progress: false

jobs:
  prepare-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out current dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Prepare synchronization candidate
        id: sync
        run: |
          set -euo pipefail
          git fetch --force origin \
            refs/heads/main:refs/remotes/origin/main \
            refs/heads/dev:refs/remotes/origin/dev

          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          DEV_SHA="$(git rev-parse refs/remotes/origin/dev)"
          test "$(git rev-parse HEAD)" = "$DEV_SHA" || {
            echo "::error::dev moved after checkout; rerun Synchronize dev"
            exit 1
          }

          SYNC_BRANCH="sync/main-${MAIN_SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" "$DEV_SHA"

          git merge --no-edit --no-ff "$MAIN_SHA" || {
            git merge --abort || true
            echo "::error::main cannot be merged cleanly into dev; synchronize it manually before the next release"
            exit 1
          }

          if git diff --quiet "$DEV_SHA" HEAD --; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
            echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
            echo "Current main introduces no content changes into dev."
            exit 0
          fi

          SYNC_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/$SYNC_BRANCH" | awk '{print $1}')"
          if [ -n "$REMOTE_SHA" ] && [ "$REMOTE_SHA" != "$SYNC_SHA" ]; then
            echo "::error::$SYNC_BRANCH already exists at $REMOTE_SHA, not $SYNC_SHA"
            exit 1
          fi

          if [ -z "$REMOTE_SHA" ]; then
            git push origin HEAD:"refs/heads/$SYNC_BRANCH"
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"

      - name: Open or reuse synchronization pull request
        if: steps.sync.outputs.needed == 'true'
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          MAIN_SHA: ${{ steps.sync.outputs.main_sha }}
          DEV_SHA: ${{ steps.sync.outputs.dev_sha }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base dev \
            --head "$SYNC_BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')"

          if [ -z "$PR_URL" ]; then
            cat > sync-pr.md <<EOF
          ## Main synchronization

          Protected \`main@$MAIN_SHA\` contains content that is not yet incorporated into \`dev@$DEV_SHA\`.

          This branch was generated by **Synchronize dev**. Review the diff and required checks, then merge this pull request manually with **Create a merge commit**. The merge commit preserves the existing \`main\` commits in \`dev\` history and avoids duplicating them in release notes.

          No workflow will merge this pull request automatically.
          EOF

            PR_URL="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base dev \
              --head "$SYNC_BRANCH" \
              --title "chore: synchronize main into dev" \
              --body-file sync-pr.md)"
          fi

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          NEEDED: ${{ steps.sync.outputs.needed }}
          MAIN_SHA: ${{ steps.sync.outputs.main_sha }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          {
            echo "### Main-to-dev synchronization"
            echo
            if [ "$NEEDED" = "true" ]; then
              echo "- Main commit: \`$MAIN_SHA\`"
              echo "- Pull request: $PR_URL"
              echo "- Review the candidate and merge it manually with **Create a merge commit**."
            else
              echo "- Current \`main\` introduces no content changes into \`dev\`; no synchronization pull request is needed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
