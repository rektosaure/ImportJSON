name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-title.mjs "$PR_TITLE"
      - run: npm ci
      - run: npm test
      - name: Stage release candidate
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          rm -rf release-candidate
          mkdir release-candidate
          cp build/* release-candidate/
          cp dist/ImportJSON.gs release-candidate/ImportJSON.gs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: importjson-release-candidate
          path: release-candidate/
          if-no-files-found: error
