name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to publish, for example 1.1.0
        required: true
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          test "$GITHUB_REF_NAME" = "main" || {
            echo "::error::Publish release must be run from main"
            exit 1
          }

      - name: Check out selected release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release identity
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version must use X.Y.Z SemVer form"
            exit 1
          }

          RELEASE_SHA="$(git rev-parse HEAD)"
          TAG_NAME="v$VERSION"

          if git rev-parse "$TAG_NAME^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "$TAG_NAME^{commit}")"
            test "$TAG_SHA" = "$RELEASE_SHA" || {
              echo "::error::$TAG_NAME already points to $TAG_SHA, not $RELEASE_SHA"
              exit 1
            }
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Test and build release
        run: npm test

      - name: Stage release assets
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir release-assets
          cp build/importjson-library.gs release-assets/importjson-library.gs
          cp build/appsscript.json release-assets/appsscript.json
          cp build/THIRD_PARTY_LICENSES.txt release-assets/THIRD_PARTY_LICENSES.txt
          cp dist/ImportJSON.gs release-assets/ImportJSON.gs

      - name: Prepare Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -n "${APPS_SCRIPT_ID:-}" || { echo "::error::Repository variable APPS_SCRIPT_ID is not configured"; exit 1; }
          test -n "${CLASPRC_JSON:-}" || { echo "::error::Repository secret CLASPRC_JSON is not configured"; exit 1; }

          mkdir -p apps-script "$HOME"
          cp release-assets/importjson-library.gs apps-script/importjson-library.gs
          cp release-assets/appsscript.json apps-script/appsscript.json
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e 'const fs=require("fs"); fs.writeFileSync(".clasp.json", JSON.stringify({scriptId: process.argv[1], rootDir: "apps-script"}, null, 2) + "\n")' "$APPS_SCRIPT_ID"

      - name: Publish immutable Apps Script version
        id: apps-script
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          CLASP="./node_modules/.bin/clasp"
          DESCRIPTION="ImportJSON ${TAG_NAME} (${RELEASE_SHA:0:12})"

          VERSIONS_JSON="$($CLASP --json list-versions)"
          APPS_SCRIPT_VERSION="$(node -e 'const versions=JSON.parse(process.argv[1]); const description=process.argv[2]; const match=versions.find((version) => version.description === description); if (match) process.stdout.write(String(match.versionNumber));' "$VERSIONS_JSON" "$DESCRIPTION")"

          if [ -z "$APPS_SCRIPT_VERSION" ]; then
            $CLASP push --force
            VERSION_JSON="$($CLASP --json create-version "$DESCRIPTION")"
            APPS_SCRIPT_VERSION="$(node -e 'const value=JSON.parse(process.argv[1]).versionNumber; if (!Number.isInteger(value)) process.exit(1); process.stdout.write(String(value));' "$VERSION_JSON")"
          fi

          echo "version_number=$APPS_SCRIPT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        env:
          APPS_SCRIPT_ID: ${{ vars.APPS_SCRIPT_ID }}
          APPS_SCRIPT_VERSION: ${{ steps.apps-script.outputs.version_number }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          BUNDLE_SHA256="$(sha256sum release-assets/importjson-library.gs | awk '{print $1}')"
          WRAPPER_SHA256="$(sha256sum release-assets/ImportJSON.gs | awk '{print $1}')"
          LICENSES_SHA256="$(sha256sum release-assets/THIRD_PARTY_LICENSES.txt | awk '{print $1}')"
          CLASP_VERSION="$(node -p 'require("./node_modules/@google/clasp/package.json").version')"

          node -e '
            const fs = require("fs");
            const [tag, version, gitCommit, scriptId, appsScriptVersion, bundleSha256, wrapperSha256, licensesSha256, claspVersion] = process.argv.slice(1);
            const manifest = {
              release: tag,
              version,
              gitCommit,
              appsScript: {
                scriptId,
                version: Number(appsScriptVersion),
              },
              artifacts: {
                "importjson-library.gs": { sha256: bundleSha256 },
                "ImportJSON.gs": { sha256: wrapperSha256 },
                "THIRD_PARTY_LICENSES.txt": { sha256: licensesSha256 },
              },
              publisher: {
                tool: "@google/clasp",
                version: claspVersion,
              },
            };
            fs.writeFileSync("release-manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' "$TAG_NAME" "$RELEASE_VERSION" "$RELEASE_SHA" "$APPS_SCRIPT_ID" "$APPS_SCRIPT_VERSION" "$BUNDLE_SHA256" "$WRAPPER_SHA256" "$LICENSES_SHA256" "$CLASP_VERSION"

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          ASSETS=(
            release-assets/importjson-library.gs
            release-assets/ImportJSON.gs
            release-assets/THIRD_PARTY_LICENSES.txt
            release-manifest.json
          )

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          if git rev-parse "$TAG_NAME^{commit}" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG_NAME" \
              --generate-notes
          else
            gh release create "$TAG_NAME" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "$TAG_NAME" \
              --generate-notes
          fi

      - name: Summary
        env:
          APPS_SCRIPT_VERSION: ${{ steps.apps-script.outputs.version_number }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          {
            echo "### Published $TAG_NAME"
            echo
            echo "- Git commit: \`$RELEASE_SHA\`"
            echo "- Apps Script version: \`$APPS_SCRIPT_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
